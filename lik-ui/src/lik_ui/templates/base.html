<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LIK{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. Defaults to light
       until the user explicitly opts into dark via the toggle. */
    (function () {
      try {
        var stored = localStorage.getItem('lik-theme');
        document.documentElement.dataset.theme = (stored === 'dark') ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js" defer></script>
  <script src="/static/tz.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="topbar">
    <nav class="topbar-nav">
      <a href="/">Agents</a>
      <a href="/sessions">Sessions</a>
      <a href="/settings">Settings</a>
      <a href="/stats">Stats</a>
      <a href="/faq">FAQ</a>
    </nav>
    <div class="topbar-account">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <span class="topbar-email">{{ user.email }}</span>
      <a href="/logout">Sign out</a>
    </div>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
