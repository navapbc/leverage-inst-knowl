# lik-ui agent roster. Each [[agents]] block is one selectable agent, referenced by NAME (not a
# platform id): the agent's name and the environment its sessions run in. lik-ui resolves those
# names to concrete ids at startup via the Claude SDK, so no platform ids live in this file — the
# roster survives re-initializing into a new workspace without any id rewrite. GitHub is the source
# of truth for the agent/environment definitions themselves (claude_platform/agents,
# claude_platform/environments), deployed by scripts/deploy_agents.py. The label shown in the picker
# is read from the agent's own definition via the SDK, not stored here.
#
# default_environment applies to any agent that omits its own environment; an agent may still set
# environment to override the default.
#
# The picker groups agents by section. Each [[sections]] block below declares a section; the order
# of the blocks is the order the sections render in. A section marked management = true holds agents
# that write shared data — those are hidden in the picker by default and revealed only when the user
# opts in via the "show management agents" preference on the Settings page. This is a usability
# guardrail against accidental use, not access control. An agent with no section (or an undeclared
# one) falls into a default group rendered after the declared sections.
#
# To add an agent: add its spec under claude_platform/agents/, deploy it, then add a [[agents]] block
# here naming it and its section, and open a PR. The app reads this file once at startup, so a new
# agent appears after a redeploy — there is no runtime reload.

default_environment = "lik-ui-env"

[[sections]]
name = "Knowledge"

[[sections]]
name = "Generic"

[[sections]]
name = "Sync to Catalog"
management = true

# [[agents]]
# # Created by init-workspace.py
# agent = "Knowledge Search Agent"
# section = "Knowledge"
# # environment omitted -> uses default_environment above

[[agents]]
# Defined by claude_platform/agents/cross-source-reference.yaml
agent = "Cross-Source Referencing Agent"
section = "Generic"
user_prompt = "Ask a question and I'll answer it by pulling from several sources at once — Nava's project Catalog, Confluence/Jira, Google Drive, Slack, and GitHub — and give you one cited answer. Try asking about a project's status across our docs and Slack, or to trace a decision to the code that implemented it."

[[agents]]
# Defined by claude_platform/agents/catalog-registration.yaml — writes to the shared Catalog.
agent = "Catalog Registration Agent"
section = "Sync to Catalog"
user_prompt = "Tell me what to register into the Discovery Layer Catalog. Today I can catalog Project Indexes — ask me to sync the project indexes and I'll crawl the project-index pages in Confluence and update one Catalog row per page."

[[agents]]
# Defined by claude_platform/agents/knowledge-search.yaml — routes to the query skills.
agent = "Knowledge Search Agent"
section = "Knowledge"
user_prompt = "Ask a Nava delivery-knowledge question and I'll route it to the right specialist — project history (has anyone done X, which projects involve Y), organizational guidance (Nava's policy on something, where a template lives), or practice how-to (the best way to approach a task)."

