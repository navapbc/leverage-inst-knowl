# Managed Agent environment spec — deployed by scripts/deploy_agents.py.
#
# The platform's raw environment export/import YAML (the shape beta.environments.create/update
# consumes). The deploy matches on `name:` (create-if-absent, else update in place). Networking
# is `limited` with `allow_mcp_servers` so an agent bound to this environment can reach the MCP
# servers it declares. The agent<->environment pairing is not stored here — it lives in lik-ui's
# roster (agents.toml), which is what pairs an offered agent with the environment its sessions run in.
name: lik-ui-env
description: null
config:
  type: cloud
  networking:
    type: limited
    allow_mcp_servers: true
    allow_package_managers: false
    allowed_hosts: []
  packages:
    type: packages
    apt: []
    cargo: []
    gem: []
    go: []
    npm: []
    pip: []
