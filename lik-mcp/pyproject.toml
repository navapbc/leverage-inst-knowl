[project]
name = "lik-mcp"
version = "0.1.0"
description = "Discovery Layer MCP service fronting the Catalog + Confirmations Postgres store."
requires-python = ">=3.11"
dependencies = [
    # Cap below 2.0: the image installs deps fresh at build time (unpinned), and mcp 2.0.0
    # removed `mcp.server.fastmcp` (which __main__ imports), so an unbounded build crashes the
    # container on startup and fails the deploy health check. Lift only with a code migration to
    # the 2.x API. (The other deps below are likewise unpinned — a lockfile is the real fix; see PR.)
    "mcp[cli]>=1.2.0,<2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
