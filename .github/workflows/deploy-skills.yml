# Deploy skill directories under `claude_platform/skills/` to Claude Managed Agents platform as new skill versions.
# Manually dispatched (like deploy-images.yml) — a maintainer chooses which skill to publish after
# the SKILL.md change has been reviewed and merged. Agents pin skills to `latest`, so a new version
# rolls out on the agent's next session with no further step. See
# docs/plans/2026-07-23-001-feat-skill-instruction-deploy-pipeline-plan.md.
#
# Prerequisites (set once in repo Settings, on the `prod` environment):
#   - Variable AWS_SSM_READ_ROLE_ARN = the github_ssm_read_role_arn Terraform output.
#   - Variable AWS_REGION            = us-east-1.
#   - Variable SSM_PREFIX = the Terraform var.ssm_prefix (e.g. /ik-arch/prod). Required, set on
#     the environment (resolves per the job's `environment:`), alongside AWS_REGION and the role.
# The Anthropic API key is fetched from SSM ($SSM_PREFIX/shared/ANTHROPIC_API_KEY) via GitHub
# OIDC — one shared key, no GitHub secret. Auth uses a role scoped to reading only that parameter
# (see infra/iam_github_oidc.tf). Same pattern in deploy-agents.yml.

name: Deploy skills to Claude platform
run-name: Deploy ${{ inputs.skill }} skill to Claude platform

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Which skill(s) to deploy
        type: choice
        options:
          - all
          - query-project-index
          - query-org-guidance
          - query-practice-knowledge
          - sync-catalog-from-project-indexes
        default: all

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The prod environment scopes AWS_SSM_READ_ROLE_ARN / AWS_REGION (and enables optional
    # deployment protection rules). Env-scoped vars only resolve when the job declares this.
    environment: prod
    env:
      SSM_PREFIX: ${{ vars.SSM_PREFIX }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SSM_READ_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch Anthropic API key from SSM
        run: |
          key=$(aws ssm get-parameter --name "$SSM_PREFIX/shared/ANTHROPIC_API_KEY" \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$key"
          echo "ANTHROPIC_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Deploy skill(s)
        working-directory: scripts
        run: uv run --frozen python deploy_skills.py --skill "${{ inputs.skill }}"
